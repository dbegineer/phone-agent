name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Unit tests and debug APKs
        run: gradle --no-daemon --stacktrace :core:test :app:assembleDebug :studio:assembleDebug

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: core/build/reports/tests/test
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: phone-agent-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Studio APK
        uses: actions/upload-artifact@v4
        with:
          name: studio-debug-apk
          path: studio/build/outputs/apk/debug/studio-debug.apk
